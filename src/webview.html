<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: var(--vscode-editor-background);
            --fg: var(--vscode-editor-foreground);
            --border: var(--vscode-widget-border, rgba(128, 128, 128, 0.35));
            --panel-bg: var(--vscode-sideBar-background);
            --muted: var(--vscode-descriptionForeground);
            --font-ui: var(--vscode-font-family);
            --font-code: var(--vscode-editor-font-family);
            --radius: 4px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-ui);
            font-size: 13px;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 16px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
        }

        .logo-area h1 {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
        }

        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-btn {
            width: 100%;
            padding: 7px 12px;
            text-align: left;
            font: inherit;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--fg);
        }

        .action-btn.primary {
            color: var(--bg);
            background: var(--fg);
            border-color: var(--fg);
        }

        .action-btn.primary:hover:not(:disabled) {
            opacity: 0.85;
        }

        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .main-content {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
        }

        .content-inner { max-width: 640px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 0;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        td {
            font-family: var(--font-code);
            font-size: 12px;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr[data-path] { cursor: pointer; }

        tbody tr[data-path]:hover td:first-child { text-decoration: underline; }

        .skip-list {
            margin: 6px 0 0;
            padding-left: 18px;
            color: var(--muted);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.6;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 200px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--fg);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .msg-box {
            padding-left: 12px;
            border-left: 2px solid var(--border);
        }

        .msg-box.error {
            border-left-width: 3px;
            border-left-color: var(--fg);
        }

        .msg-title {
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 600;
        }

        .msg-desc {
            margin: 0;
            line-height: 1.5;
            color: var(--muted);
        }

        code {
            font-family: var(--font-code);
            font-size: 12px;
            color: var(--fg);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area">
            <h1>ATest Generator</h1>
        </div>

        <div class="actions-container" id="buttons-container"></div>
    </aside>

    <main class="main-content">
        <div class="content-inner" id="content-area">
            <div class="msg-box">
                <h3 class="msg-title">Панель управления</h3>
                <p class="msg-desc">Выберите действие на панели слева.</p>
            </div>
        </div>
    </main>

    <script>
        const vscode = acquireVsCodeApi();

        const buttonsContainer = document.getElementById('buttons-container');
        const contentArea = document.getElementById('content-area');

        let isGenerating = false;
        let isAutoMode = false;
        let requestTimeout = null;

        const buttonsConfig = [
            { id: 'btn-generate', label: 'Сгенерировать тесты', colorClass: 'primary', action: () => generateTests() },
            { id: 'btn-swap', label: 'Вкл. Авторежим', colorClass: 'secondary', action: () => toggleAutoMode() }
        ];

        function esc(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function renderButtons() {
            buttonsContainer.innerHTML = '';
            buttonsConfig.forEach(btn => {
                const button = document.createElement('button');
                button.id = btn.id;
                button.className = `action-btn ${btn.colorClass}`;
                button.textContent = btn.label;

                if (btn.id === 'btn-swap') {
                    button.textContent = isAutoMode ? 'Выкл. Авторежим' : 'Вкл. Авторежим';
                }

                if (isGenerating) {
                    button.disabled = true;
                }

                button.addEventListener('click', btn.action);
                buttonsContainer.appendChild(button);
            });
        }

        function resetButtons() {
            isGenerating = false;
            renderButtons();
            if (requestTimeout) clearTimeout(requestTimeout);
        }

        function setRequestTimeout(ms, errorMsg) {
            if (requestTimeout) clearTimeout(requestTimeout);
            requestTimeout = setTimeout(() => {
                resetButtons();
                renderError(errorMsg);
            }, ms);
        }

        function renderLoading(text, subtext = 'Пожалуйста, подождите...') {
            contentArea.innerHTML = `
                <div class="loader-wrapper">
                    <div class="spinner"></div>
                    <h3 style="margin:0; font-size:13px; font-weight:600;">${esc(text)}</h3>
                    <p style="margin:0; color:var(--muted);">${esc(subtext)}</p>
                </div>
            `;
        }

        function renderError(text) {
            contentArea.innerHTML = `
                <div class="msg-box error">
                    <h3 class="msg-title">Ошибка</h3>
                    <p class="msg-desc">${esc(text)}</p>
                </div>
            `;
        }

        function generateTests() {
            isGenerating = true;
            renderButtons();
            renderLoading('Сбор контрактов и отправка', 'Отправляем файлы на сервер...');
            setRequestTimeout(10 * 60 * 1000, 'Сервер не ответил за 10 минут.');
            vscode.postMessage({ command: 'getAllFiles' });
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            vscode.postMessage({ command: 'tgleAutoMode' });
            renderButtons();
        }

        window.addEventListener('message', event => {
            const message = event.data;

            if (requestTimeout) clearTimeout(requestTimeout);

            if (message.command === 'error') {
                resetButtons();
                renderError(message.message);
                return;
            }

            if (message.command === 'filesReady') {
                const fileKeys = Object.keys(message.data);

                if (fileKeys.length === 0) {
                    resetButtons();
                    contentArea.innerHTML = `
                        <div class="msg-box">
                            <h3 class="msg-title">Контракты не найдены</h3>
                            <p class="msg-desc">В папке <code>contracts</code> нет файлов.</p>
                        </div>
                    `;
                }

                return;
            }

            if (message.command === 'jobQueued') {
                renderLoading(
                    `Задача #${message.data.id} в очереди`,
                    'Генерируем тесты — это может занять до минуты.'
                );
                return;
            }

            if (message.command === 'reportReady') {
                resetButtons();

                const data = message.data;
                const skipped = data.skipped || [];
                const rows = data.files.map(file =>
                    `<tr data-path="${esc(file.path)}">` +
                    `<td>${esc(file.path)}</td>` +
                    `<td style="text-align: right;">${file.tests}</td>` +
                    `</tr>`
                ).join('');

                const summary = data.totalFiles > 0
                    ? `Файлов: ${data.totalFiles} · тестов: ${data.totalTests} · ` +
                      'нажмите на строку, чтобы открыть файл'
                    : 'Все подходящие файлы уже существуют или пропущены.';

                const table = rows
                    ? `<table>
                           <thead><tr><th>Файл</th><th style="text-align: right;">Тестов</th></tr></thead>
                           <tbody>${rows}</tbody>
                       </table>`
                    : '';

                const note = skipped.length
                    ? `<p class="msg-desc" style="margin-top: 16px;">Пропущено:</p>
                       <ul class="skip-list">
                           ${skipped.map(item => `<li>${esc(item.path)} — ${esc(item.reason)}</li>`).join('')}
                       </ul>`
                    : '';

                contentArea.innerHTML = `
                    <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600;">
                        ${data.totalFiles > 0 ? 'Тесты записаны' : 'Новых тестов нет'}
                    </h2>
                    <p class="msg-desc" style="margin-bottom: 16px;">${summary}</p>
                    ${table}
                    ${note}
                `;
            }
        });

        contentArea.addEventListener('click', event => {
            const row = event.target.closest('tr[data-path]');
            if (row) {
                vscode.postMessage({ command: 'openFile', path: row.getAttribute('data-path') });
            }
        });

        renderButtons();
    </script>
</body>
</html>
